[project]
name = "everything-mcp"
version = "0.1.0"
description = "Ultra-fast Everything (voidtools) search MCP server for AI agents"
readme = "README.md"
authors = [{ name = "JaviRTX" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
everything-mcp = "everything_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everything_mcp"]
